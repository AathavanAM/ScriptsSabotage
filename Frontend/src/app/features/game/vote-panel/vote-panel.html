<div class="p-6">

    <h2 class="text-3xl font-bold mb-4 text-center">Vote the Impostor</h2>

    <div class="grid grid-cols-2 gap-4">
        @for (player of players; track $index) {
        <button (click)="vote(player)" class="p-4 rounded-xl border text-lg" [class.bg-red-500]="selected === player">
            {{ player }}
        </button>
        }
    </div>

    @if (selected) {
    <button (click)="submitVote()" class="w-full px-6 py-3 bg-green-600 mt-6 rounded-xl text-white">
        Submit Vote
    </button>
    }

</div>
