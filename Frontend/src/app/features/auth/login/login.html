<div class="login-container">
    <!-- Animated Background -->
    <div class="absolute inset-0 bg-gradient-to-br from-gray-900 via-purple-900 to-black overflow-hidden">
        <!-- Floating Film Reels -->
        <div class="absolute inset-0 opacity-20">
            <div class="absolute top-1/4 left-1/6 animate-float-slow">
                <div class="w-12 h-12 border-4 border-purple-500 rounded-full flex items-center justify-center">
                    <div class="w-3 h-3 bg-purple-500 rounded-full"></div>
                </div>
            </div>
            <div class="absolute top-1/3 right-1/5 animate-float-slow" style="animation-delay: 2s;">
                <div class="w-8 h-8 border-4 border-pink-500 rounded-full flex items-center justify-center">
                    <div class="w-2 h-2 bg-pink-500 rounded-full"></div>
                </div>
            </div>
            <div class="absolute bottom-1/4 left-1/4 animate-float-slow" style="animation-delay: 4s;">
                <div class="w-16 h-16 border-4 border-blue-500 rounded-full flex items-center justify-center">
                    <div class="w-4 h-4 bg-blue-500 rounded-full"></div>
                </div>
            </div>
        </div>

        <!-- Movie Clapperboards -->
        <div class="absolute inset-0 opacity-15">
            <div class="absolute top-1/2 right-1/6 animate-spin-slow">
                <div class="w-10 h-6 bg-white rounded-sm transform rotate-45"></div>
            </div>
            <div class="absolute bottom-1/3 left-1/8 animate-spin-slow" style="animation-delay: 3s;">
                <div class="w-8 h-5 bg-white rounded-sm transform -rotate-45"></div>
            </div>
        </div>

        <!-- Popcorn Elements -->
        <div class="absolute inset-0 opacity-25">
            <div class="absolute top-20 left-1/3 animate-bounce" style="animation-delay: 0.5s;">
                <div class="w-3 h-4 bg-yellow-400 rounded-full transform rotate-45"></div>
            </div>
            <div class="absolute top-40 right-1/4 animate-bounce" style="animation-delay: 1.2s;">
                <div class="w-2 h-3 bg-yellow-300 rounded-full transform -rotate-12"></div>
            </div>
            <div class="absolute bottom-32 left-1/2 animate-bounce" style="animation-delay: 0.8s;">
                <div class="w-4 h-5 bg-yellow-500 rounded-full transform rotate-12"></div>
            </div>
        </div>

        <!-- Animated Background Blobs -->
        <div
            class="absolute -top-20 -right-20 w-60 h-60 bg-purple-600 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-pulse-slow">
        </div>
        <div class="absolute -bottom-20 -left-20 w-60 h-60 bg-blue-600 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-pulse-slow"
            style="animation-delay: 2s;"></div>
        <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-80 h-80 bg-red-600 rounded-full mix-blend-multiply filter blur-3xl opacity-15 animate-pulse-slow"
            style="animation-delay: 4s;"></div>

        <!-- Floating Text Elements -->
        <div class="absolute inset-0 opacity-10">
            <div class="absolute top-1/6 left-1/10 animate-float-very-slow text-white text-sm font-bold">MOVIE</div>
            <div class="absolute top-2/3 right-1/8 animate-float-very-slow text-white text-sm font-bold"
                style="animation-delay: 3s;">CINEMA</div>
            <div class="absolute bottom-1/4 left-1/2 animate-float-very-slow text-white text-sm font-bold"
                style="animation-delay: 6s;">FILM</div>
        </div>
    </div>

    <!-- Login Form -->
    <div class="flex items-center justify-center min-h-screen px-4 relative z-10">
        <div
            class="w-96 bg-white/95 backdrop-blur-lg p-8 rounded-2xl shadow-2xl transform transition-all duration-500 hover:shadow-xl login-card border border-white/20">

            <!-- Header -->
            <div class="text-center mb-8">
                <div
                    class="w-16 h-16 bg-gradient-to-r from-blue-600 to-purple-600 rounded-full mx-auto mb-4 flex items-center justify-center transform transition-transform duration-300 hover:scale-110 hover:rotate-3">
                    <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                    </svg>
                </div>
                <h2 class="text-3xl font-bold text-gray-800 mb-2 slide-in-top">Welcome Back</h2>
                <p class="text-gray-600 text-sm fade-in">Sign in to your Script Sabotage account</p>
            </div>

            <!-- Error -->
            @if (errorMsg) {
            <div class="error-message">
                {{ errorMsg }}
            </div>
            }

            <!-- Form -->
            <div class="space-y-4">

                <div class="input-group">
                    <div class="input-icon">
                        <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M3 8l7.89 4.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                        </svg>
                    </div>
                    <input [(ngModel)]="mobile" type="text" placeholder="Mobile Number" class="input-field"
                        (focus)="onInputFocus($event)" (blur)="onInputBlur($event)" />
                </div>

                <div class="input-group">
                    <div class="input-icon">
                        <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                        </svg>
                    </div>
                    <input [(ngModel)]="password" type="password" placeholder="Password" class="input-field"
                        (focus)="onInputFocus($event)" (blur)="onInputBlur($event)" />
                </div>

                <button (click)="submitLogin()" class="login-btn" [class.loading]="isLoading">
                    @if (!isLoading) {
                    <span>Sign In</span>
                    } @else {
                    <div class="loading-spinner"></div>
                    }
                </button>

            </div>

            <!-- Register -->
            <div class="text-center mt-6 pt-6 border-t border-gray-200/50">
                <p class="text-gray-600 text-sm">
                    Don't have an account?
                    <a routerLink="/auth/register" class="register-link" (click)="navigateToRegister()">
                        Create an account
                    </a>
                </p>
            </div>

        </div>
    </div>
</div>
