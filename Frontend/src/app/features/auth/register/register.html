<div class="register-container">
    <!-- Animated Background -->
    <div class="absolute inset-0 bg-gradient-to-br from-gray-900 via-purple-900 to-black overflow-hidden">
        <!-- Floating Film Reels -->
        <div class="absolute inset-0 opacity-20">
            <div class="absolute top-1/4 left-1/5 animate-float-slow">
                <div class="w-12 h-12 border-4 border-green-500 rounded-full flex items-center justify-center">
                    <div class="w-3 h-3 bg-green-500 rounded-full"></div>
                </div>
            </div>
            <div class="absolute top-1/3 right-1/4 animate-float-slow" style="animation-delay: 2s;">
                <div class="w-8 h-8 border-4 border-teal-500 rounded-full flex items-center justify-center">
                    <div class="w-2 h-2 bg-teal-500 rounded-full"></div>
                </div>
            </div>
            <div class="absolute bottom-1/4 left-1/3 animate-float-slow" style="animation-delay: 4s;">
                <div class="w-16 h-16 border-4 border-emerald-500 rounded-full flex items-center justify-center">
                    <div class="w-4 h-4 bg-emerald-500 rounded-full"></div>
                </div>
            </div>
        </div>

        <!-- Movie Clapperboards -->
        <div class="absolute inset-0 opacity-15">
            <div class="absolute top-1/2 right-1/6 animate-spin-slow">
                <div class="w-10 h-6 bg-white rounded-sm transform rotate-45"></div>
            </div>
            <div class="absolute bottom-1/3 left-1/8 animate-spin-slow" style="animation-delay: 3s;">
                <div class="w-8 h-5 bg-white rounded-sm transform -rotate-45"></div>
            </div>
        </div>

        <!-- Popcorn Elements -->
        <div class="absolute inset-0 opacity-25">
            <div class="absolute top-20 left-1/4 animate-bounce" style="animation-delay: 0.5s;">
                <div class="w-3 h-4 bg-yellow-400 rounded-full transform rotate-45"></div>
            </div>
            <div class="absolute top-40 right-1/3 animate-bounce" style="animation-delay: 1.2s;">
                <div class="w-2 h-3 bg-yellow-300 rounded-full transform -rotate-12"></div>
            </div>
            <div class="absolute bottom-32 left-1/2 animate-bounce" style="animation-delay: 0.8s;">
                <div class="w-4 h-5 bg-yellow-500 rounded-full transform rotate-12"></div>
            </div>
        </div>

        <!-- Animated Background Blobs -->
        <div
            class="absolute -top-20 -right-20 w-60 h-60 bg-green-600 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-pulse-slow">
        </div>
        <div class="absolute -bottom-20 -left-20 w-60 h-60 bg-teal-600 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-pulse-slow"
            style="animation-delay: 2s;"></div>
        <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-80 h-80 bg-emerald-600 rounded-full mix-blend-multiply filter blur-3xl opacity-15 animate-pulse-slow"
            style="animation-delay: 4s;"></div>

        <!-- Floating Text Elements -->
        <div class="absolute inset-0 opacity-10">
            <div class="absolute top-1/6 left-1/10 animate-float-very-slow text-white text-sm font-bold">JOIN US</div>
            <div class="absolute top-2/3 right-1/8 animate-float-very-slow text-white text-sm font-bold"
                style="animation-delay: 3s;">SIGN UP</div>
            <div class="absolute bottom-1/4 left-1/2 animate-float-very-slow text-white text-sm font-bold"
                style="animation-delay: 6s;">CREATE</div>
        </div>

        <!-- Film Strip Effect -->
        <div
            class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-transparent via-white to-transparent opacity-5 animate-pulse">
        </div>
        <div class="absolute bottom-0 left-0 w-full h-2 bg-gradient-to-r from-transparent via-white to-transparent opacity-5 animate-pulse"
            style="animation-delay: 1s;"></div>
    </div>

    <!-- Register Form -->
    <div class="flex items-center justify-center min-h-screen px-4 relative z-10">
        <div
            class="w-96 bg-white/95 backdrop-blur-lg p-8 rounded-2xl shadow-2xl transform transition-all duration-500 hover:shadow-xl register-card border border-white/20">

            <!-- Logo/Header with animation -->
            <div class="text-center mb-8">
                <div
                    class="w-16 h-16 bg-gradient-to-r from-green-600 to-teal-600 rounded-full mx-auto mb-4 flex items-center justify-center transform transition-transform duration-300 hover:scale-110 hover:rotate-3">
                    <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z" />
                    </svg>
                </div>
                <h2 class="text-3xl font-bold text-gray-800 mb-2 slide-in-top">Create Account</h2>
                <p class="text-gray-600 text-sm fade-in">Join Script Sabotage Today</p>
            </div>

            <!-- Error Message with animation -->
            @if(errorMsg) {
            <div class="error-message">
                {{ errorMsg }}
            </div>
            }

            <!-- Form Inputs -->
            <div class="space-y-4">
                <!-- Mobile Input -->
                <div class="input-group">
                    <div class="input-icon">
                        <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
                        </svg>
                    </div>
                    <input [(ngModel)]="mobile" type="text" placeholder="Mobile Number" class="input-field"
                        (focus)="onInputFocus($event)" (blur)="onInputBlur($event)" />
                </div>

                <!-- Username Input -->
                <div class="input-group">
                    <div class="input-icon">
                        <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                        </svg>
                    </div>
                    <input [(ngModel)]="username" type="text" placeholder="Username" class="input-field"
                        (focus)="onInputFocus($event)" (blur)="onInputBlur($event)" />
                </div>

                <!-- Gender Select -->
                <div class="input-group">
                    <div class="input-icon">
                        <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 2C13.1 2 14 2.9 14 4C14 5.1 13.1 6 12 6C10.9 6 10 5.1 10 4C10 2.9 10.9 2 12 2ZM21 9V7L15.37 12.59C14.71 12.22 13.89 12 13 12C10.79 12 9 13.79 9 16C9 18.21 10.79 20 13 20C15.21 20 17 18.21 17 16C17 15.09 16.64 14.26 16.06 13.65L21 9Z" />
                        </svg>
                    </div>
                    <select [(ngModel)]="gender" class="input-field select-field" (focus)="onInputFocus($event)"
                        (blur)="onInputBlur($event)">
                        <option value="" class="text-gray-400">Select Gender</option>
                        <option value="Male" class="text-gray-800">Male</option>
                        <option value="Female" class="text-gray-800">Female</option>
                    </select>
                    <div class="select-arrow">
                        <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                        </svg>
                    </div>
                </div>

                <!-- Password Input -->
                <div class="input-group">
                    <div class="input-icon">
                        <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                        </svg>
                    </div>
                    <input [(ngModel)]="password" type="password" placeholder="Password" class="input-field"
                        (focus)="onInputFocus($event)" (blur)="onInputBlur($event)" />
                </div>

                <!-- Register Button -->
                <button (click)="submitRegister()" class="register-btn" [class.loading]="isLoading">
                    @if(!isLoading){
                    <span>Create Account</span>
                    } @else {
                    <div class="loading-spinner"></div>
                    }
                </button>
            </div>

            <!-- Login Link -->
            <div class="text-center mt-6 pt-6 border-t border-gray-200/50">
                <p class="text-gray-600 text-sm">
                    Already have an account?
                    <a routerLink="/auth/login" class="login-link" (click)="navigateToLogin($event)">
                        Sign in here
                    </a>
                </p>
            </div>

        </div>
    </div>
</div>
