<div
    class="min-h-screen bg-gradient-to-br from-gray-900 via-blue-900 to-purple-900 text-white flex flex-col items-center justify-center p-6 relative overflow-hidden">

    <!-- Animated Background Elements -->
    <div class="absolute inset-0 overflow-hidden">
        <div
            class="absolute -top-40 -right-40 w-80 h-80 bg-blue-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-pulse-slow">
        </div>
        <div class="absolute -bottom-40 -left-40 w-80 h-80 bg-purple-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-pulse-slow"
            style="animation-delay: 2s;"></div>
        <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-cyan-500 rounded-full mix-blend-multiply filter blur-3xl opacity-10 animate-pulse-slow"
            style="animation-delay: 4s;"></div>

        <!-- Floating Code Elements -->
        <div *ngFor="let code of floatingCodes; let i = index"
            class="absolute text-2xl font-mono text-white opacity-5 animate-float" [style.left]="code.left"
            [style.top]="code.top" [style.animation-delay]="code.delay">
            {{ code.value }}
        </div>
    </div>

    <div
        class="max-w-md w-full mx-auto bg-gray-800/80 backdrop-blur-lg rounded-2xl shadow-2xl p-8 transform transition-all duration-500 hover:shadow-3xl relative z-10 create-room-card">

        <!-- Header Section -->
        <div class="text-center mb-8">
            <div
                class="w-20 h-20 bg-gradient-to-r from-blue-500 to-purple-600 rounded-2xl mx-auto mb-4 flex items-center justify-center transform transition-transform duration-300 hover:scale-110 hover:rotate-3">
                <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
                </svg>
            </div>
            <h2
                class="text-4xl font-bold mb-2 bg-gradient-to-r from-blue-400 to-purple-400 bg-clip-text text-transparent slide-in-top">
                Create Room</h2>
            <p class="text-gray-300 fade-in">Start your movie watching party</p>
        </div>

        <!-- Action Buttons Container -->
        <div class="space-y-6 action-buttons-container">

            <!-- Generate Room Code Button -->
            <button (click)="generateRoom()" class="action-btn generate-btn w-full" [class.loading]="isGenerating"
                [disabled]="isGenerating">
                <span *ngIf="!isGenerating" class="flex items-center justify-center">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M13 10V3L4 14h7v7l9-11h-7z" />
                    </svg>
                    Generate Room Code
                </span>
                <div *ngIf="isGenerating" class="loading-spinner"></div>
            </button>

            <!-- Room Code Display -->
            @if(roomCode) {
            <div class="room-code-display animate-bounce-in">
                <div class="text-center mb-2">
                    <span class="text-sm text-gray-300">Your Room Code</span>
                </div>
                <div class="room-code-value">
                    {{ roomCode }}
                </div>
                <div class="flex gap-2 mt-4">
                    <button (click)="copyToClipboard()" class="flex-1 action-btn copy-btn">
                        <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                        </svg>
                        Copy
                    </button>
                    <button (click)="shareRoom()" class="flex-1 action-btn share-btn">
                        <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z" />
                        </svg>
                        Share
                    </button>
                </div>
            </div>
            }

            <!-- Divider -->
            <div class="relative flex items-center py-4">
                <div class="flex-grow border-t border-gray-600"></div>
                <span class="flex-shrink mx-4 text-gray-400 text-sm">OR</span>
                <div class="flex-grow border-t border-gray-600"></div>
            </div>

            <!-- Join Room Button -->
            <button (click)="navigateToJoinRoom()" class="action-btn join-btn w-full">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z" />
                </svg>
                Join Existing Room
            </button>

            <!-- Home Button -->
            <button (click)="navigateToHome()" class="action-btn home-btn w-full">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                </svg>
                Back to Home
            </button>

        </div>

        <!-- Status Messages -->
        <div *ngIf="statusMessage" class="status-message mt-4" [class.success]="statusType === 'success'"
            [class.error]="statusType === 'error'">
            {{ statusMessage }}
        </div>

    </div>

    <!-- Background Pattern -->
    <div class="absolute inset-0 opacity-10">
        <div class="absolute inset-0 background-pattern"></div>
    </div>
</div>
