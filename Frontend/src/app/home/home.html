<div class="min-h-screen bg-gray-900 text-white relative overflow-hidden">
    <!-- Animated Background Elements -->
    <div class="absolute inset-0 bg-gradient-to-br from-gray-900 via-purple-900 to-black">
        <!-- Floating Film Reels -->
        <div class="absolute inset-0 opacity-20">
            <div class="absolute top-10 left-10 animate-float-slow">
                <div class="w-16 h-16 border-4 border-purple-500 rounded-full flex items-center justify-center">
                    <div class="w-4 h-4 bg-purple-500 rounded-full"></div>
                </div>
            </div>
            <div class="absolute top-20 right-20 animate-float-slow" style="animation-delay: 1s;">
                <div class="w-12 h-12 border-4 border-pink-500 rounded-full flex items-center justify-center">
                    <div class="w-3 h-3 bg-pink-500 rounded-full"></div>
                </div>
            </div>
            <div class="absolute bottom-32 left-32 animate-float-slow" style="animation-delay: 2s;">
                <div class="w-20 h-20 border-4 border-blue-500 rounded-full flex items-center justify-center">
                    <div class="w-5 h-5 bg-blue-500 rounded-full"></div>
                </div>
            </div>
        </div>

        <!-- Animated Background Blobs -->
        <div
            class="absolute -top-40 -right-40 w-80 h-80 bg-purple-600 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-pulse-slow">
        </div>
        <div class="absolute -bottom-40 -left-40 w-80 h-80 bg-blue-600 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-pulse-slow"
            style="animation-delay: 2s;"></div>
    </div>

    <!-- Main Content -->
    <div class="relative z-10 min-h-screen flex flex-col items-center justify-center p-6 home-content">
        <!-- Logo/Title Section -->
        <div class="text-center mb-12">
            <!-- Animated Logo -->
            <div
                class="w-24 h-24 bg-gradient-to-r from-red-600 via-purple-600 to-blue-600 rounded-2xl mx-auto mb-6 flex items-center justify-center transform transition-transform duration-500 hover:scale-110 hover:rotate-3">
                <svg class="w-12 h-12 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M7 4v16M17 4v16M3 8h4m10 0h4M3 12h18M3 16h4m10 0h4M4 20h16a1 1 0 001-1V5a1 1 0 00-1-1H4a1 1 0 00-1 1v14a1 1 0 001 1z" />
                </svg>
            </div>

            <!-- Main Title -->
            <h1 class="cinematic-title mb-4">
                SCRIPT SABOTAGE
            </h1>

            <!-- Subtitle -->
            <p class="text-xl md:text-2xl text-gray-300 mb-2 animate-fade-in-up">
                The Ultimate Movie Experience
            </p>
            <p class="text-lg md:text-xl text-gray-400 animate-fade-in-up" style="animation-delay: 0.2s;">
                Create. Join. Watch Together.
            </p>
        </div>

        <!-- Action Buttons -->
        <div
            class="flex flex-col md:flex-row gap-6 justify-center items-stretch w-full max-w-md mx-auto action-buttons">
            <!-- Create Room Button -->
            <button (click)="gotoCreateRoom()" class="action-btn create-btn group">
                <div class="flex items-center justify-center space-x-4">
                    <div class="btn-icon">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
                        </svg>
                    </div>
                    <div class="text-left">
                        <div class="btn-title">Create Room</div>
                        <div class="btn-subtitle">Start a new movie party</div>
                    </div>
                </div>
            </button>

            <!-- Join Room Button -->
            <button (click)="gotoJoinRoom()" class="action-btn join-btn group">
                <div class="flex items-center justify-center space-x-4">
                    <div class="btn-icon">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
                        </svg>
                    </div>
                    <div class="text-left">
                        <div class="btn-title">Join Room</div>
                        <div class="btn-subtitle">Enter with a code</div>
                    </div>
                </div>
            </button>
        </div>
    </div>
</div>
